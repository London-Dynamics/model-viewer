<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; Path tracer cache beauty demo</title>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Path tracer cache beauty demo: Epic, no cache, and full frame."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link type="text/css" href="../../styles/examples.css" rel="stylesheet" />
    <link type="text/css" href="../../styles/docs.css" rel="stylesheet" />
    <link
      rel="shortcut icon"
      type="image/png"
      href="../../assets/favicon.png"
    />
    <style>
      html,
      body {
        background: #fff;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      .shell {
        background: #fff;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 240px;
        height: 100vh;
        width: 100%;
      }

      .stage {
        background: #fff;
        min-width: 0;
        position: relative;
      }

      .stage model-viewer {
        background: #fff;
        display: block;
        height: 100%;
        width: 100%;
      }

      .panel {
        background: #fff;
        border-left: 1px solid #bdbdbd;
        box-sizing: border-box;
        color: rgba(0, 0, 0, 0.87);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        overflow: auto;
        padding: 0.75rem;
      }

      .panel p,
      .panel label,
      .panel li {
        font-size: 0.75rem;
        line-height: 1.35;
        margin: 0;
      }

      .panel label {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }

      .panel select,
      .panel button {
        box-sizing: border-box;
        width: 100%;
      }

      .panel .links a {
        color: #1d4ed8;
      }

      .timeline {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .timeline li {
        border-top: 1px solid rgba(0, 0, 0, 0.12);
        display: grid;
        gap: 0 0.5rem;
        grid-template-columns: minmax(0, 1fr) auto;
        padding: 0.35rem 0;
      }

      .timeline .name {
        font-weight: 500;
      }

      .timeline .at,
      .timeline .detail {
        color: rgba(0, 0, 0, 0.54);
        grid-column: 1 / -1;
      }

      .timeline li.complete .name,
      .timeline li.complete .dur {
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="shell" id="beauty">
      <div class="stage" id="stage"></div>
      <aside class="panel" id="panel" data-ready="0" data-saved="0">
        <p class="font-medium">Path tracer cache</p>
        <p>
          16 samples, 15 bounces, OIDN. The picture stays hidden until denoise
          finishes.
          <span class="links">
            <a href="../ld_path_tracer/">Examples</a>
            ·
            <a href="../ld_path_tracer_settings/">Settings</a>
          </span>
        </p>
        <label>
          Test case
          <select id="case"></select>
        </label>
        <label>
          Preset
          <select id="preset"></select>
        </label>
        <button id="clear" type="button">Clear caches</button>
        <p id="run-label">Starting</p>
        <p id="fps">FPS —</p>
        <ul class="timeline" id="caches">
          <li><span class="name">BVH</span><span id="cache-bvh">—</span></li>
          <li><span class="name">Irradiance</span><span id="cache-irradiance">—</span></li>
          <li><span class="name">Materials</span><span id="cache-materials">—</span></li>
        </ul>
        <ol class="timeline" id="timeline"></ol>
      </aside>
    </div>

    <script
      type="module"
      src="../../../../node_modules/@london-dynamics/model-viewer/dist/model-viewer.js"
    ></script>
    <script type="module">
      const CASES = {
        triton: {
          label: 'Triton Beauty Demo',
          src: 'https://assets.v2.londondynamics.com/547e0656-5fe2-4a43-aae0-6b39d3a4ee3a/puzzle/638be48e-26fd-1c99-a9c6-981ae0e920f4.glb',
          hdr: 'https://assets.v2.londondynamics.com/00000000-0000-0000-0000-000000000000/00000000-0000-0000-0000-000000000000/environments/dancing_hall_2k_desat.hdr',
          camera: {
            'camera-orbit': '17.946747643962443rad 1.5654198050001467rad 7m',
            'camera-target': '-0.2468m 0.9902m -0.1196m',
            'field-of-view': '40deg',
            'min-field-of-view': '12deg',
            'max-field-of-view': '40deg',
            'min-camera-orbit': 'auto 0deg 7m',
            'max-camera-orbit': 'auto 94deg 10.5m',
          },
        },
        montana: {
          label: 'Montana 001112',
          src: 'https://assets.v2.londondynamics.com/28d24461-579e-4156-99c4-ca336f4369db/puzzledefault/8daea_4e25777e-91ff-80c3-872f-c722d4937c36.glb',
          hdr: 'https://d1mepjfmhz5ui7.cloudfront.net/centurion/Centurion-2.hdr',
          bounds: 'tight',
        },
        ri245: {
          label: 'Centurion Ri245',
          src: 'https://assets.v2.londondynamics.com/daa34851-84b3-4c29-8823-fc258ccd9049/puzzle/17949ff9-26b2-7158-2f6d-f48ba6ddf725.glb',
          hdr: 'https://assets.v2.londondynamics.com/00000000-0000-0000-0000-000000000000/00000000-0000-0000-0000-000000000000/environments/aircraft_workshop_4_Soft_BW.hdr',
          bounds: 'tight',
        },
      };

      const PRESETS = {
        epic: {label: 'Epic', coverage: true, cache: true},
        nocache: {label: 'No cache', coverage: true, cache: false},
        fullframe: {label: 'No cache, full frame', coverage: false, cache: false},
      };

      const DB_NAME = 'ld-path-tracer-beauty';
      const DB_STORE = 'files';
      const STEPS = [
        'load',
        'bvh',
        'prep',
        'trace-start',
        'trace',
        'denoise',
        'complete',
      ];

      const caseSelect = document.querySelector('#case');
      const presetSelect = document.querySelector('#preset');
      const stage = document.querySelector('#stage');
      const panel = document.querySelector('#panel');
      const runLabel = document.querySelector('#run-label');
      const fpsNode = document.querySelector('#fps');
      const timeline = document.querySelector('#timeline');
      const cacheNodes = {
        bvh: document.querySelector('#cache-bvh'),
        irradiance: document.querySelector('#cache-irradiance'),
        materials: document.querySelector('#cache-materials'),
      };

      for (const [id, item] of Object.entries(CASES)) {
        const option = document.createElement('option');
        option.value = id;
        option.textContent = item.label;
        caseSelect.append(option);
      }
      for (const [id, item] of Object.entries(PRESETS)) {
        const option = document.createElement('option');
        option.value = id;
        option.textContent = item.label;
        presetSelect.append(option);
      }
      for (const id of STEPS) {
        const item = document.createElement('li');
        item.dataset.step = id;
        if (id === 'complete') item.className = 'complete';
        item.innerHTML = '<span class="name"></span><span class="dur"></span><span class="at"></span><span class="detail"></span>';
        timeline.append(item);
      }

      const params = new URLSearchParams(location.search);
      let caseId = CASES[params.get('case')] ? params.get('case') : 'triton';
      let presetId = PRESETS[params.get('preset')] ? params.get('preset') : 'epic';
      caseSelect.value = caseId;
      presetSelect.value = presetId;

      const format = (ms) => {
        if (ms == null || !Number.isFinite(ms)) return '—';
        if (ms > 0 && ms < 10) return '<0.01 s';
        return `${(ms / 1000).toFixed(2)} s`;
      };

      const since = (t0, at) => at == null ? null : at - t0;

      const openDb = () => new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(DB_STORE)) {
            request.result.createObjectStore(DB_STORE);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });

      const cacheKey = (id) => `beauty-demo:${id}`;

      const readCache = async (id) => {
        const db = await openDb();
        try {
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, 'readonly');
            const request = tx.objectStore(DB_STORE).get(cacheKey(id));
            request.onsuccess = () => resolve(request.result ?? null);
            request.onerror = () => reject(request.error);
          });
        } finally {
          db.close();
        }
      };

      const writeCache = async (id, blob) => {
        const db = await openDb();
        try {
          await new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, 'readwrite');
            tx.objectStore(DB_STORE).put(blob, cacheKey(id));
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        } finally {
          db.close();
        }
      };

      const clearCaches = async () => {
        const db = await openDb();
        try {
          await new Promise((resolve, reject) => {
            const tx = db.transaction(DB_STORE, 'readwrite');
            const store = tx.objectStore(DB_STORE);
            const request = store.getAllKeys();
            request.onsuccess = () => {
              for (const key of request.result) {
                if (String(key).startsWith('beauty-demo:')) store.delete(key);
              }
            };
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        } finally {
          db.close();
        }
      };

      let viewer = null;
      let blobUrl = null;
      let poll = 0;
      let saved = false;

      const writeUrl = () => {
        const url = new URL(location.href);
        url.searchParams.set('case', caseId);
        url.searchParams.set('preset', presetId);
        history.replaceState(null, '', url);
      };

      const cacheState = (type, preset, status, session, warm, ready) => {
        if (!preset.cache) return 'off';
        const applied = status?.lastLoad?.applied;
        if (warm && applied == null) return 'loaded';
        if (warm) return applied.includes(type) ? 'loaded' : 'off';
        if (type === 'bvh' && session?.bvhFinishedAt != null) return 'built';
        if (type !== 'bvh' && session?.prepFinishedAt != null) return 'built';
        if (ready) return 'built';
        return '…';
      };

      const paintStep = (id, row) => {
        const item = timeline.querySelector(`[data-step="${id}"]`);
        item.querySelector('.name').textContent = row.name;
        item.querySelector('.dur').textContent = format(row.duration);
        item.querySelector('.at').textContent = row.at == null ? 'since start —' : `since start ${format(row.at)}`;
        const detail = item.querySelector('.detail');
        detail.textContent = row.detail ?? '';
        detail.hidden = !row.detail;
      };

      const start = async () => {
        cancelAnimationFrame(poll);
        saved = false;
        panel.dataset.saved = '0';
        panel.dataset.ready = '0';
        panel.dataset.totalMs = '';
        delete panel.dataset.opacityAtReady;
        if (blobUrl) {
          URL.revokeObjectURL(blobUrl);
          blobUrl = null;
        }
        viewer?.remove();
        const test = CASES[caseId];
        const preset = PRESETS[presetId];
        const stored = preset.cache ? await readCache(caseId) : null;
        let warm = stored instanceof Blob;
        let runKind = preset.cache ? (warm ? 'warm' : 'cold') : 'uncached';
        viewer = document.createElement('model-viewer');
        viewer.setAttribute('camera-controls', '');
        viewer.setAttribute('interaction-prompt', 'none');
        viewer.setAttribute('tone-mapping', 'neutral');
        viewer.setAttribute('shadow-intensity', '0');
        viewer.setAttribute('shadow-softness', '0');
        viewer.setAttribute('environment-image', test.hdr);
        viewer.setAttribute('path-tracer', '');
        viewer.setAttribute('path-tracer-samples', '16');
        viewer.setAttribute('path-tracer-bounces', '15');
        viewer.setAttribute('path-tracer-denoise', '');
        viewer.setAttribute('path-tracer-display', 'after-denoise');
        if (preset.coverage) viewer.setAttribute('path-tracer-coverage', '');
        if (test.bounds) viewer.setAttribute('bounds', test.bounds);
        for (const [key, value] of Object.entries(test.camera ?? {})) {
          viewer.setAttribute(key, value);
        }
        if (preset.cache) {
          viewer.setAttribute('path-tracer-cache-bvh', '');
          viewer.setAttribute('path-tracer-cache-irradiance', '');
          viewer.setAttribute('path-tracer-cache-materials', '');
          viewer.setAttribute('path-tracer-cache-load-bvh', '');
          viewer.setAttribute('path-tracer-cache-load-irradiance', '');
          viewer.setAttribute('path-tracer-cache-load-materials', '');
        }
        stage.append(viewer);
        if (warm) {
          try {
            await viewer.updateComplete;
            const result = await viewer.loadPathTracerCache(stored);
            warm = (result?.applied ?? []).includes('bvh');
          } catch (error) {
            warm = false;
            console.warn('Cache load failed', error);
          }
          runKind = warm ? 'warm' : 'cold';
        }
        const t0 = performance.now();
        let glbAt = null;
        let firstFrameAt = null;
        viewer.addEventListener('load', () => {
          glbAt = performance.now();
          requestAnimationFrame(() => {
            if (firstFrameAt == null) firstFrameAt = performance.now();
          });
        }, {once: true});
        panel.dataset.run = runKind;
        viewer.src = test.src;

        let frames = 0;
        let fpsWindow = performance.now();
        let fps = 0;
        const tick = (now) => {
          frames++;
          if (now - fpsWindow >= 400) {
            fps = frames * 1000 / (now - fpsWindow);
            frames = 0;
            fpsWindow = now;
          }
          const composer = viewer.getPathTracerComposer?.();
          const session = composer?.pathTracer ?? null;
          const status = viewer.getPathTracerCacheStatus?.() ?? null;
          const readyAt = session?.denoiseFinishedAt ?? null;
          const ready = readyAt != null;
          const totalMs = ready ? readyAt - t0 : null;
          const bvhStart = session?.bvhStartedAt ?? null;
          const bvhEnd = session?.bvhFinishedAt ?? null;
          const prepStart = session?.prepStartedAt ?? null;
          const prepEnd = session?.prepFinishedAt ?? null;
          const loopStart = session?.traceLoopStartedAt ?? null;
          const origin = session?.traceOriginAt ?? 0;
          const firstSampleMs = session?.firstSampleMs ?? null;
          const firstSampleAt = firstSampleMs == null || origin === 0 ? null : origin + firstSampleMs;
          const samplesAt = session?.samplesReadyAt ?? null;
          const denoiseStart = session?.denoiseInvokeAt ?? samplesAt;
          const loadEnd = firstFrameAt ?? glbAt;
          const restored = status?.timings?.bvhRestored ?? 0;
          const built = status?.timings?.bvhBuilt ?? 0;
          const bvhName = restored > 0 && built === 0 ? 'BVH restore' : 'BVH build';
          const bvhDetail = restored > 0 && built === 0 ? `loaded ${restored}` :
              built > 0 ? `built ${built}` : '';
          runLabel.textContent = `${runKind} · ${preset.label} · ${test.label}`;
          fpsNode.textContent = `FPS ${fps.toFixed(0)}`;
          for (const type of ['bvh', 'irradiance', 'materials']) {
            cacheNodes[type].textContent = cacheState(type, preset, status, session, warm, ready);
          }
          paintStep('load', {
            name: 'First load',
            duration: loadEnd == null ? null : loadEnd - t0,
            at: since(t0, loadEnd),
            detail: glbAt == null ? '' : `GLB ${format(glbAt - t0)} · realtime frame ${format(firstFrameAt == null ? null : firstFrameAt - glbAt)}`,
          });
          paintStep('bvh', {
            name: bvhName,
            duration: bvhStart == null || bvhEnd == null ? null : bvhEnd - bvhStart,
            at: since(t0, bvhEnd),
            detail: bvhDetail,
          });
          paintStep('prep', {
            name: 'Material / irradiance',
            duration: prepStart == null || prepEnd == null ? null : prepEnd - prepStart,
            at: since(t0, prepEnd),
            detail: '',
          });
          paintStep('trace-start', {
            name: 'Path trace start',
            duration: loopStart == null || firstSampleAt == null ? null : firstSampleAt - loopStart,
            at: since(t0, firstSampleAt),
            detail: '',
          });
          paintStep('trace', {
            name: 'Full trace',
            duration: firstSampleAt == null || samplesAt == null ? null : samplesAt - firstSampleAt,
            at: since(t0, samplesAt),
            detail: '16 samples on the GPU',
          });
          paintStep('denoise', {
            name: 'Denoise',
            duration: readyAt == null || denoiseStart == null ? null : readyAt - denoiseStart,
            at: since(t0, readyAt),
            detail: '',
          });
          paintStep('complete', {
            name: 'Complete',
            duration: totalMs,
            at: totalMs,
            detail: 'denoised, fade excluded',
          });
          panel.dataset.ready = ready ? '1' : '0';
          panel.dataset.totalMs = totalMs ?? '';
          panel.dataset.run = runKind;
          if (ready && panel.dataset.opacityAtReady == null) {
            const canvas = viewer.shadowRoot?.querySelector('.path-tracer-webgpu');
            panel.dataset.opacityAtReady = canvas == null ? '' : getComputedStyle(canvas).opacity;
          }
          if (ready && preset.cache && !warm && !saved) {
            saved = true;
            viewer.exportPathTracerCache().then((blob) => writeCache(caseId, blob)).then(() => {
              panel.dataset.saved = '1';
            }).catch((error) => {
              panel.dataset.saved = 'error';
              console.warn('Cache save failed', error);
            });
          }
          if (ready && (warm || !preset.cache)) panel.dataset.saved = '1';
          poll = requestAnimationFrame(tick);
        };
        poll = requestAnimationFrame(tick);
      };

      const selectAndStart = () => {
        caseId = caseSelect.value;
        presetId = presetSelect.value;
        writeUrl();
        start();
      };

      caseSelect.addEventListener('change', selectAndStart);
      presetSelect.addEventListener('change', selectAndStart);
      document.querySelector('#clear').addEventListener('click', async () => {
        await clearCaches();
        start();
      });

      writeUrl();
      start();
    </script>
  </body>
</html>
