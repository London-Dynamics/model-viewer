<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; LD Water Real Scale</title>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="&lt;model-viewer&gt; LD Water real-scale example"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link type="text/css" href="../../styles/examples.css" rel="stylesheet" />
    <link type="text/css" href="../../styles/ld-examples.css" rel="stylesheet" />
    <link type="text/css" href="../../styles/docs.css" rel="stylesheet" />
    <link
      rel="shortcut icon"
      type="image/png"
      href="../../assets/favicon.png"
    />
    <style type="text/tailwindcss"></style>
    <script
      src="../../styles/ld-ui-loader.js"
      data-href="../../styles/ld-ui.css"
    ></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
      #water-real-scale example-snippet,
      #water-real-scale example-snippet > template ~ * {
        display: block;
      }

      .ld-water-stage {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100%;
      }

      .ld-water-stage > model-viewer {
        background:
          radial-gradient(
            circle at 50% 35%,
            rgba(255, 220, 170, 0.35),
            transparent 28rem
          ),
          linear-gradient(
            180deg,
            #7aa6c7 0%,
            #c8e0ea 42%,
            #0f3f5a 43%,
            #061b28 100%
          );
        flex: 1 1 auto;
        height: auto;
        min-height: 0;
        width: 100%;
      }
    </style>
  </head>
  <body class="ld">
    <div class="examples-page">
      <div class="sidebar" id="sidenav"></div>
      <div id="toggle"></div>

      <div class="examples-container">
        <div class="sample minimized-content">
          <div id="water-real-scale"></div>
          <div class="content">
            <button
              type="button"
              class="content-toggle"
              aria-expanded="false"
              aria-controls="water-real-scale-content"
            >
              Info & code
            </button>
            <div id="water-real-scale-content" class="wrapper">
              <div class="heading">
                <h2 class="demo-title">
                  LD Water real scale with
                  <span class="attribute">water</span>
                </h2>
                <h4>
                  This page keeps the Centurion GLB at scale 1 and uses an LD
                  water preset scaled from the 15x upstream reference scene.
                </h4>
              </div>
              <example-snippet stamp-to="water-real-scale" highlight-as="html">
                <template>
                  <div class="ld-water-stage">
                    <model-viewer
                      id="water-real-scale-demo"
                      camera-controls
                      touch-action="pan-y"
                      interaction-prompt="none"
                      min-camera-orbit="auto auto 0.0007m"
                      max-camera-orbit="auto auto 66.667m"
                      camera-orbit="45deg 65deg 10.667m"
                      camera-target="0m 0.1m 0m"
                      shadow-intensity="0"
                      environment-image="https://assets.v2.londondynamics.com/00000000-0000-0000-0000-000000000000/00000000-0000-0000-0000-000000000000/environments/dancing_hall_2k_desat.hdr"
                      water-preset="ld-boat-real-scale"
                      water-quality="medium"
                      water-elevation="-0.053"
                      water-buoyancy
                      water-sky-image="/threejs-water-pro/demo/public/hdris/industrial_sunset_02_puresky_4k.jpg"
                      scale="1 1 1"
                      src="http://assets.v2.londondynamics.com/daa34851-84b3-4c29-8823-fc258ccd9049/puzzle/1b8c7427-600c-ae8d-1cc0-70d9757aebfd.glb"
                      alt="Centurion boat staged for real-scale LD Water"
                    >
                    </model-viewer>
                    <div
                      id="water-status"
                      class="ld-hud ld-hud-top-left ld-hud-passive ld-hud-narrow"
                    >
                      water: initializing
                    </div>
                    <div class="ld-panel">
                      <div class="ld-card">
                        <div class="ld-card-body">
                          <h3 class="ld-panel-title">LD Water Real Scale</h3>
                          <p
                            id="water-status-inline"
                            class="ld-helper-text"
                          >
                            water: initializing
                          </p>
                          <div class="ld-sections">
                            <section>
                              <h4 class="ld-section-title">Model</h4>
                              <p class="ld-helper-text">
                                Centurion at scale 1
                              </p>
                            </section>
                            <section>
                              <h4 class="ld-section-title">Water</h4>
                              <label class="ld-switch-row">
                                <span class="ld-label">Enable water</span>
                                <button
                                  id="water-enabled"
                                  type="button"
                                  class="ld-switch"
                                  role="switch"
                                  aria-checked="true"
                                >
                                  <span
                                    class="ld-switch-thumb"
                                    aria-hidden="true"
                                  ></span>
                                </button>
                              </label>
                              <div class="ld-axis-grid">
                                <label class="ld-field">
                                  <span class="ld-label">Preset</span>
                                  <span class="ld-select-wrap">
                                    <select id="water-preset" class="ld-select">
                                      <option
                                        value="ld-boat-real-scale"
                                        selected
                                      >
                                        ld-boat-real-scale
                                      </option>
                                    </select>
                                    <span
                                      class="ld-select-chevron"
                                      aria-hidden="true"
                                      >▾</span
                                    >
                                  </span>
                                </label>
                                <label class="ld-field">
                                  <span class="ld-label">Quality</span>
                                  <span class="ld-select-wrap">
                                    <select id="water-quality" class="ld-select">
                                      <option value="low">low</option>
                                      <option value="medium" selected>
                                        medium
                                      </option>
                                      <option value="high">high</option>
                                      <option value="ultra">ultra</option>
                                    </select>
                                    <span
                                      class="ld-select-chevron"
                                      aria-hidden="true"
                                      >▾</span
                                    >
                                  </span>
                                </label>
                                <label class="ld-field">
                                  <span class="ld-label">Elevation</span>
                                  <input
                                    id="water-elevation"
                                    class="ld-input-number"
                                    type="number"
                                    step="0.01"
                                    value="-0.053"
                                  />
                                </label>
                              </div>
                            </section>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <script type="module">
                    (() => {
                      const modelViewer = document.querySelector(
                        '#water-real-scale-demo'
                      );
                      const status = document.querySelector('#water-status');
                      const inlineStatus = document.querySelector(
                        '#water-status-inline'
                      );
                      const setStatus = (message) => {
                        status.textContent = message;
                        inlineStatus.textContent = message;
                      };
                      document
                        .querySelector('#water-preset')
                        .addEventListener('change', (event) => {
                          modelViewer.setAttribute(
                            'water-preset',
                            event.target.value
                          );
                        });
                      document
                        .querySelector('#water-quality')
                        .addEventListener('change', (event) => {
                          modelViewer.setAttribute(
                            'water-quality',
                            event.target.value
                          );
                        });
                      document
                        .querySelector('#water-elevation')
                        .addEventListener('input', (event) => {
                          modelViewer.setAttribute(
                            'water-elevation',
                            event.target.value
                          );
                        });

                      const waterEnabled =
                        document.querySelector('#water-enabled');
                      waterEnabled.addEventListener('click', () => {
                        const enabled =
                          waterEnabled.getAttribute('aria-checked') !== 'true';
                        waterEnabled.setAttribute(
                          'aria-checked',
                          String(enabled)
                        );
                        modelViewer.toggleAttribute('water', enabled);
                        setStatus(
                          enabled ? 'water: initializing' : 'water: disabled'
                        );
                      });

                      modelViewer.addEventListener('water-load', () => {
                        setStatus('water: loaded');
                      });
                      modelViewer.addEventListener('water-error', (event) => {
                        setStatus(`water: ${event.detail.error.message}`);
                      });
                      modelViewer.toggleAttribute('water', true);
                    })();
                  </script>
                </template>
              </example-snippet>
            </div>
          </div>
        </div>

        <div class="footer">
          <ul></ul>
          <div style="margin-top: 24px" class="copyright">
            ©Copyright 2026 London Dynamics. Licensed under the Apache License
            2.0.
          </div>
          <div id="footer-links"></div>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="../../examples/built/docs-and-examples.js"
    ></script>
    <script type="module">
      (() => {
        init('examples-ld_water_real_scale');
      })();
      (() => {
        initFooterLinks();
      })();
      (() => {
        document.querySelectorAll('.sample').forEach((sample) => {
          const toggle = sample.querySelector('.content-toggle');
          if (toggle == null) {
            return;
          }

          toggle.addEventListener('click', () => {
            const expanded = sample.classList.toggle('content-expanded');
            toggle.setAttribute('aria-expanded', String(expanded));
          });
        });
      })();
    </script>

    <!-- Documentation-specific dependencies: -->
    <script type="module" src="../built/dependencies.js"></script>

    <!-- WebGPU water needs model-viewer, three/webgpu, and threejs-water-pro to share one Three runtime. -->
    <script type="importmap">
      {
        "imports": {
          "three": "../../../model-viewer/node_modules/three/build/three.module.js",
          "three/webgpu": "../../../model-viewer/node_modules/three/build/three.webgpu.js",
          "three/tsl": "../../../model-viewer/node_modules/three/build/three.tsl.js",
          "three/addons/": "../../../model-viewer/node_modules/three/examples/jsm/",
          "three/examples/jsm/": "../../../model-viewer/node_modules/three/examples/jsm/",
          "threejs-water-pro": "../../../../threejs-water-pro/build/index.js"
        }
      }
    </script>

    <!-- Loads <model-viewer> on modern browsers: -->
    <script
      type="module"
      src="../../../model-viewer/dist/model-viewer-module.js?v=real-scale-water-v2"
    ></script>
  </body>
</html>
